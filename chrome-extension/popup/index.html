<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>一键双语翻译</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main class="popup">
			<header class="brand">
				<img src="../assets/icons/icon.svg" alt="" width="28" height="28" />
				<div class="brand-copy">
					<h1 class="brand-title">一键双语</h1>
				</div>
				<span id="extension-version" class="version">v—</span>
			</header>

			<section class="reader-card" aria-label="语言方向与网页翻译操作">
				<fieldset id="language-fields" class="language-fields" aria-describedby="language-note" disabled>
					<legend class="sr-only">默认语言方向</legend>
					<div class="language-path">
						<label class="language-field source-field" for="source-language">
							<span>输入语言</span>
							<select id="source-language">
								<option value="auto">自动检测</option>
								<option value="en">English</option>
								<option value="zh">简体中文</option>
							</select>
							<svg class="select-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
						</label>
						<svg class="language-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
						<label class="language-field target-field" for="target-language">
							<span>输出语言</span>
							<select id="target-language">
								<option value="zh">简体中文</option>
								<option value="en">English</option>
							</select>
							<svg class="select-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
						</label>
					</div>
				</fieldset>
				<p id="language-note" class="language-note">自动检测输入；已是简体中文的内容会跳过</p>
				<button
					id="toggle-translation"
					class="main-action"
					type="button"
					aria-label="翻译当前网页"
					aria-describedby="popup-status"
					aria-busy="false"
					disabled
				>
					<strong id="toggle-label">翻译网页</strong>
					<svg class="action-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" /></svg>
				</button>
				<output id="popup-status" class="status" data-tone="working" role="status" aria-live="polite" aria-atomic="true" aria-busy="true">正在连接扩展后台…</output>
			</section>

			<section class="reading-tools" aria-label="阅读工具">
				<div class="reading-tools-row">
					<button id="toggle-selection" class="selection-action" type="button" aria-pressed="false" disabled>划词翻译</button>
					<label class="style-control" for="reading-style">
						<span>译文</span>
						<select id="reading-style" disabled>
							<option value="soft">柔和底色</option>
							<option value="plain">自然段落</option>
							<option value="underline">细线标记</option>
						</select>
					</label>
				</div>
				<p>选中文字即可翻译或朗读英语。</p>
			</section>

			<button id="open-settings" class="provider-action" type="button">
				<span class="provider-copy">
					<small>翻译服务</small>
					<strong id="current-provider">正在读取…</strong>
					<span id="current-model">—</span>
				</span>
				<span class="change-label">设置 <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 4 4 4-4 4" /></svg></span>
			</button>

			<footer class="utility-row">
				<button id="open-reading" class="utility-action" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /></svg>阅读与发音</button>
				<p class="privacy-note">API Key 仅存本机</p>
			</footer>
		</main>
		<script src="popup.js"></script>
	</body>
</html>
