<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>一键双语翻译</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main class="popup">
			<header class="brand">
				<img src="../assets/icons/icon.svg" alt="" width="40" height="40" />
				<h1 class="brand-title">一键双语</h1>
				<span id="extension-version" class="version">v—</span>
			</header>

			<section class="reader-card" aria-label="语言方向与网页翻译操作">
				<fieldset id="language-fields" class="language-fields" aria-describedby="language-note" disabled>
					<legend>默认语言方向</legend>
					<div class="language-path">
						<label class="language-field source-field" for="source-language">
							<span>输入语言</span>
							<select id="source-language">
								<option value="auto">自动检测</option>
								<option value="en">English</option>
								<option value="zh">简体中文</option>
							</select>
							<svg class="select-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
						</label>
						<label class="language-field target-field" for="target-language">
							<span>输出语言</span>
							<select id="target-language">
								<option value="zh">简体中文</option>
								<option value="en">English</option>
							</select>
							<svg class="select-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
						</label>
					</div>
				</fieldset>
				<p id="language-note" class="language-note">自动检测输入；已是简体中文的内容会跳过</p>
				<button
					id="toggle-translation"
					class="main-action"
					type="button"
					aria-label="翻译 / 恢复当前网页"
					aria-describedby="popup-status"
					aria-busy="false"
					disabled
				>
					<strong id="toggle-label">翻译 / 恢复</strong>
					<svg class="action-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" /></svg>
				</button>
				<output id="popup-status" class="status" role="status" aria-live="polite" aria-atomic="true">正在连接扩展后台…</output>
			</section>

			<button id="open-settings" class="provider-action" type="button">
				<span class="provider-copy">
					<small>翻译服务</small>
					<strong id="current-provider">正在读取…</strong>
					<span id="current-model">—</span>
				</span>
				<span class="change-label">更改 <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 4 4 4-4 4" /></svg></span>
			</button>

			<footer class="utility-row">
				<button id="open-debug" class="debug-action" type="button">
					<i aria-hidden="true"></i>
					调试记录
					<small id="debug-state" class="debug-state">—</small>
				</button>
				<p class="privacy-note">API Key 仅存本机</p>
			</footer>
		</main>
		<script src="popup.js"></script>
	</body>
</html>
